<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 178 32" width="178" height="32" role="img" aria-label="Fairmeter">
  <!-- Primary lockup: symbol at cap-height x 1.6 (25px against the 30px
       display step), gap = half the symbol width, wordmark in Fraunces 600
       at -0.02em. Minimum width 96px; below that, use the submark. -->
  <g transform="translate(0 3.5) scale(0.78125)">
    <rect x="4" y="6" width="12" height="16" fill="#a8551f"/>
    <rect x="18" y="12" width="10" height="10" fill="#6b7a4a"/>
    <rect x="4" y="25" width="24" height="3" fill="#23281f"/>
  </g>
  <text x="37.5" y="26.5" fill="#23281f"
        font-family="Fraunces, 'Iowan Old Style', Georgia, 'Times New Roman', serif"
        font-size="30" font-weight="600" letter-spacing="-0.6">Fairmeter</text>
</svg>
